<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where Is Everyone? BBS Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f1f5f9;
      color: #0f172a;
      padding: 20px;
    }

    header {
      background-color: #ffffff;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      color: #1e293b;
    }

    .subtitle {
      color: #64748b;
      font-size: 14px;
      margin-top: 4px;
    }

    .time-badge {
      background-color: #0f172a;
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .live-dot {
      width: 10px;
      height: 10px;
      background-color: #22c55e;
      border-radius: 50%;
      display: inline-block;
    }

    .controls-bar {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #e2e8f0;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }

    button:hover {
      background-color: #f8fafc;
      border-color: #94a3b8;
    }

    button.active {
      background-color: #2563eb;
      color: white;
      border-color: #2563eb;
    }

    input[type="range"] {
      width: 160px;
      cursor: pointer;
    }

    input[type="time"], input[type="date"], select {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-size: 13px;
    }

    input[type="text"] {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      width: 200px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .card {
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      border: 2px solid transparent;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-yellow { background-color: #fef9c3; border-color: #fde047; color: #713f12; }
    .card-pink { background-color: #fce7f3; border-color: #fbcfe8; color: #831843; }
    .card-orange { background-color: #ffedd5; border-color: #fed7aa; color: #7c2d12; }
    .card-green { background-color: #dcfce7; border-color: #bbf7d0; color: #14532d; }
    .card-blue { background-color: #dbeafe; border-color: #bfdbfe; color: #1e3a8a; }
    .card-purple { background-color: #f3e8ff; border-color: #e9d5ff; color: #581c87; }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .card-title { font-size: 20px; font-weight: 800; }
    .location-badge {
      background-color: rgba(255, 255, 255, 0.7);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .activity-title { font-size: 22px; font-weight: 800; margin: 6px 0; }
    .time-range { font-size: 14px; opacity: 0.85; font-weight: 600; }

    .progress-container {
      background-color: rgba(0, 0, 0, 0.08);
      border-radius: 10px;
      height: 8px;
      width: 100%;
      margin: 15px 0;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background-color: currentColor;
      border-radius: 10px;
      width: 0%;
      transition: width 0.3s ease;
    }

    .card-footer {
      background-color: rgba(255, 255, 255, 0.5);
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
    }

    .full-schedules {
      margin-top: 30px;
      background-color: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }

    .schedule-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    .schedule-table th, .schedule-table td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid #e2e8f0;
      font-size: 14px;
    }

    .schedule-table tr.active-row {
      background-color: #f0fdf4;
      font-weight: bold;
    }

    .tab-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .specials-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 12px;
      background: rgba(0,0,0,0.06);
    }
  
    /* Phone / tablet layout */
    @media (max-width: 700px) {
      body { padding: 10px; }
      header { padding: 14px; margin-bottom: 12px; }
      .header-top { gap: 10px; }
      h1 { font-size: 21px; }
      .subtitle { font-size: 12px; }
      .time-badge { font-size: 16px; padding: 7px 11px; }
      .controls-bar { margin-top: 12px; padding-top: 12px; gap: 9px; }
      .control-group { width: 100%; flex-wrap: wrap; }
      .control-group button { flex: 1; min-height: 42px; }
      input[type="range"] { flex: 1; min-width: 150px; width: auto; }
      input[type="time"], input[type="date"], select, input[type="text"] {
        min-height: 40px; font-size: 15px;
      }
      input[type="text"] { width: 100%; }
      .dashboard-grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .card { padding: 14px; border-radius: 10px; }
      .card-title { font-size: 18px; }
      .activity-title { font-size: 20px; }
      .full-schedules { margin-top: 14px; padding: 12px; overflow-x: auto; }
      .tab-buttons { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; }
      .tab-buttons button { white-space: nowrap; min-height: 40px; }
      .schedule-table { min-width: 650px; }
    }
    @media (display-mode: standalone) {
      body { padding-top: max(10px, env(safe-area-inset-top)); }
    }

  </style>

      let h = Math.floor(mins / 60);
      let m = mins % 60;
      let ampm = h >= 12 ? 'PM' : 'AM';

      let displayM = m < 10 ? '0' + m : m;

      const now = new Date();
      return now.getHours() * 60 + now.getMinutes();
    }

    function getSelectedDate() {
      return document.getElementById('datePicker').value;
    }

    function getSpecialForTeacher(teacher, dateStr) {
      const d = new Date(dateStr + "T00:00:00");
      const dayNum = d.getDay(); // 0 Sun, 1 Mon, 2 Tue, 3 Wed, 4 Thu, 5 Fri, 6 Sat
      const tData = specialsMatrix[teacher];

      if (!tData || dayNum === 0 || dayNum === 6) return "No Specials (Weekend)";

      // Standard Mon / Tue / Thu / Fri schedule lookup
      if (dayNum === 1) return tData.Mon;
      if (dayNum === 2) return tData.Tue;
      if (dayNum === 4) return tData.Thu;
      if (dayNum === 5) return tData.Fri;

      // Wednesday Week Rotation Logic:
      // Week 1 = Monday Specials, Week 2 = Tuesday Specials, Week 3 = Thursday Specials, Week 4 = Friday Specials
      if (dayNum === 3) {
        const rotationWeek = wednesdayRotationMap[dateStr] || 1;
        
        switch (rotationWeek) {
          case 1: return tData.Mon; // Week 1 -> Monday Special
          case 2: return tData.Tue; // Week 2 -> Tuesday Special
          case 3: return tData.Thu; // Week 3 -> Thursday Special
          case 4: return tData.Fri; // Week 4 -> Friday Special
          default: return tData.Mon;
        }
      }
      
      return "N/A";
    }

    function toggleLiveMode(val) {
      isLive = val;
      if (isLive) {
        const now = new Date();
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        document.getElementById('datePicker').value = `${yyyy}-${mm}-${dd}`;
      }
      document.getElementById('liveBtn').classList.toggle('active', isLive);
      document.getElementById('liveDot').style.backgroundColor = isLive ? '#22c55e' : '#94a3b8';
      renderDashboard();
    }

    function toggleStemDay() {
      isStemDay = !isStemDay;
      document.getElementById('stemToggle').innerText = `STEM Day: ${isStemDay ? 'ON' : 'OFF'}`;
      renderDashboard();
    }

    function onDateChange(val) {
      renderDashboard();
    }

    function onSliderChange(val) {
      simulatedMinutes = parseInt(val);
      toggleLiveMode(false);
      updatePickerFromMinutes();
      renderDashboard();
    }

    function onPickerChange(val) {
      simulatedMinutes = timeToMinutes(val);
      toggleLiveMode(false);
      document.getElementById('timeSlider').value = simulatedMinutes;
      renderDashboard();
    }

    function updatePickerFromMinutes() {
      let h = Math.floor(simulatedMinutes / 60);
      let m = simulatedMinutes % 60;
      let hh = h < 10 ? '0' + h : h;
      let mm = m < 10 ? '0' + m : m;
      document.getElementById('timePicker').value = `${hh}:${mm}`;
    }

    function renderDashboard() {
      const mins = getCurrentTimeMinutes();
      const dateStr = getSelectedDate();
      document.getElementById('currentTimeDisplay').innerText = formatMinutes(mins);

      const cardsGrid = document.getElementById('cardsGrid');
      const search = document.getElementById('searchInput').value.toLowerCase();
      cardsGrid.innerHTML = '';

      Object.keys(schedules).forEach(grade => {
        const gradeData = schedules[grade];
        const colorClass = `card-${gradeData.color}`;

        let currentActivity = null;
        let nextActivity = null;
        let currentIdx = -1;

        gradeData.items.forEach((item, idx) => {
          let s = timeToMinutes(item.start);
          let e = timeToMinutes(item.end);
          if (mins >= s && mins < e) {
            currentActivity = item;
            currentIdx = idx;
          }
        });

        if (currentIdx !== -1 && currentIdx + 1 < gradeData.items.length) {
          nextActivity = gradeData.items[currentIdx + 1];
        }

        let name = "Transition";
        let loc = "Hallway";
        let startMins = 0, endMins = 0, pct = 0, remaining = 0;

        if (currentActivity) {
          name = (isStemDay || !currentActivity.altName) ? currentActivity.name : currentActivity.altName;
          loc = currentActivity.loc;
          startMins = timeToMinutes(currentActivity.start);
          endMins = timeToMinutes(currentActivity.end);
          let duration = endMins - startMins;
          let elapsed = mins - startMins;
          pct = Math.min(100, Math.max(0, Math.round((elapsed / duration) * 100)));
          remaining = endMins - mins;
        }

        if (search && !name.toLowerCase().includes(search) && !grade.toLowerCase().includes(search)) {
          let matchesTeacher = false;
          Object.keys(teacherGradeMap).forEach(t => {
            if (teacherGradeMap[t] === grade && t.toLowerCase().includes(search)) matchesTeacher = true;
          });
          if (!matchesTeacher) return;
        }

        let nextName = nextActivity ? ((isStemDay || !nextActivity.altName) ? nextActivity.name : nextActivity.altName) : "End of Day";

        cardsGrid.innerHTML += `
          <div class="card ${colorClass}">
            <div>
              <div class="card-header">
                <div class="card-title">${grade}</div>
                <div class="location-badge">${loc}</div>
              </div>
              <div class="time-range">${currentActivity ? `${formatMinutes(startMins)} - ${formatMinutes(endMins)}` : 'Currently'}</div>
              <div class="activity-title">${name}</div>
            </div>

            <div>
              <div class="progress-container">
                <div class="progress-bar" style="width: ${pct}%"></div>
              </div>
              <div class="card-footer">
                <div><strong>${remaining} mins</strong> remaining (${pct}% complete)</div>
                <div>Next: <strong>${nextName}</strong></div>
              </div>
            </div>
          </div>
        `;
      });

      renderScheduleTabs();
      renderScheduleTable();
    }

    function renderScheduleTabs() {
      const container = document.getElementById('tabButtons');
      container.innerHTML = '';
      Object.keys(schedules).forEach(grade => {
        let active = grade === selectedGradeTab ? 'active' : '';
        container.innerHTML += `<button class="${active}" onclick="selectTab('${grade}')">${grade}</button>`;
      });
    }

    function selectTab(grade) {
      selectedGradeTab = grade;
      renderScheduleTabs();
      renderScheduleTable();
    }

    function renderScheduleTable() {
      const mins = getCurrentTimeMinutes();
      const dateStr = getSelectedDate();
      const container = document.getElementById('scheduleTableContainer');
      const items = schedules[selectedGradeTab].items;

      // Find teachers in this grade
      const gradeTeachers = Object.keys(teacherGradeMap).filter(t => teacherGradeMap[t] === selectedGradeTab);

      let html = `
        <div style="margin-bottom: 15px; background: #f8fafc; padding: 12px; border-radius: 8px;">
          <strong>Teacher Specials Assignments for ${dateStr}:</strong>
          <div style="display: flex; gap: 15px; flex-wrap: wrap; margin-top: 6px;">
            ${gradeTeachers.map(t => `
              <div>
                <span style="font-weight: 600;">${t}:</span>
                <span class="specials-badge">${getSpecialForTeacher(t, dateStr)}</span>
              </div>
            `).join('')}
          </div>
        </div>

        <table class="schedule-table">
          <thead>
            <tr>
              <th>Time</th>
              <th>Activity / Period</th>
              <th>Location</th>
              <th>Specials Breakdown (By Teacher)</th>
            </tr>
          </thead>
          <tbody>
      `;

      items.forEach(item => {
        let s = timeToMinutes(item.start);
        let e = timeToMinutes(item.end);
        let isActive = mins >= s && mins < e;
        let name = (isStemDay || !item.altName) ? item.name : item.altName;

        let teacherSpecialsInfo = "-";
        if (item.isSpecials) {
          teacherSpecialsInfo = gradeTeachers.map(t => `${t} → <strong>${getSpecialForTeacher(t, dateStr)}</strong>`).join(', ');
        }

        html += `
          <tr class="${isActive ? 'active-row' : ''}">
            <td>${formatMinutes(s)} - ${formatMinutes(e)}</td>
            <td>${name}</td>
            <td>${item.loc}</td>
            <td>${teacherSpecialsInfo}</td>
          </tr>
        `;
      });

      html += `</tbody></table>`;
      container.innerHTML = html;
    }

    setInterval(() => {
      if (isLive) renderDashboard();
    }, 10000);

    renderDashboard();

    // Enable offline/app-style behavior when hosted over HTTPS.
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
